<style>
@font-face{font-family:'Quicksand';src:url(fonts/quicksand.woff2) format('woff2');font-weight:300 700}
@font-face{font-family:'Great Vibes';src:url(fonts/greatvibes.woff2) format('woff2')}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#F8C9DA;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#stage{position:absolute;left:0;top:0;width:1024px;height:600px;transform-origin:0 0}
button{outline:none}

body{margin:0}
a{color:#8A2450}a:hover{color:#5E1636}
@keyframes twinkle{0%,100%{opacity:.25;transform:scale(.6) rotate(0deg)}50%{opacity:1;transform:scale(1) rotate(20deg)}}
@keyframes glow{0%,100%{opacity:.55}50%{opacity:.9}}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.sp{position:absolute;animation:twinkle 3.2s ease-in-out infinite;pointer-events:none}
.halo-glow{animation:glow 4s ease-in-out infinite}
.rays{transform-origin:100px 82px;animation:spin 60s linear infinite}
.dock-btn{transition:transform .15s ease}
.crystals{position:absolute;inset:4px;pointer-events:none;border-radius:16px;
--gem:radial-gradient(circle at 38% 34%,#FFFFFF 0 1.4px,#FDF0F6 2px,#F3C4D9 3.4px,#D98AAF 4.6px,#B8678F 5.3px,rgba(255,255,255,0) 5.9px);
background:var(--gem) top left/14px 14px repeat-x,var(--gem) bottom left/14px 14px repeat-x,var(--gem) top left/14px 14px repeat-y,var(--gem) top right/14px 14px repeat-y;
box-shadow:inset 0 0 0 15px rgba(255,255,255,0.18);animation:gemglow 1.8s ease-in-out infinite}
@keyframes gemglow{0%,100%{filter:brightness(1) saturate(1) drop-shadow(0 0 0 rgba(255,255,255,0))}50%{filter:brightness(1.35) saturate(1.2) drop-shadow(0 0 4px rgba(255,255,255,0.95))}}
.crystals-twinkle{position:absolute;inset:4px;pointer-events:none;border-radius:16px;
--hi:radial-gradient(circle at 50% 50%,#FFFFFF 0 2.2px,rgba(255,255,255,0.75) 3.4px,rgba(255,255,255,0) 6px);
background:var(--hi) 7px 0/42px 14px repeat-x,var(--hi) 28px 100%/42px 14px repeat-x,var(--hi) 0 21px/14px 42px repeat-y,var(--hi) 100% 7px/14px 42px repeat-y;
animation:twinkleA 1.4s ease-in-out infinite}
.crystals-twinkle.b{background:var(--hi) 28px 0/42px 14px repeat-x,var(--hi) 7px 100%/42px 14px repeat-x,var(--hi) 0 0/14px 42px repeat-y,var(--hi) 100% 28px/14px 42px repeat-y;animation-delay:.7s}
@keyframes twinkleA{0%,100%{opacity:0}50%{opacity:1}}
@keyframes sweep{0%{transform:translateX(-120%)}100%{transform:translateX(120%)}}
.crystals-sweep{position:absolute;inset:0;pointer-events:none;overflow:hidden;border-radius:18px;-webkit-mask:linear-gradient(#000 0 0) top/100% 22px no-repeat,linear-gradient(#000 0 0) bottom/100% 22px no-repeat;mask:linear-gradient(#000 0 0) top/100% 22px no-repeat,linear-gradient(#000 0 0) bottom/100% 22px no-repeat}
.crystals-sweep::before{content:"";position:absolute;inset:0;background:linear-gradient(100deg,rgba(255,255,255,0) 40%,rgba(255,255,255,0.95) 50%,rgba(255,255,255,0) 60%);animation:sweep 3.5s ease-in-out infinite}
.crystals-line{position:absolute;inset:20px;pointer-events:none;border-radius:12px;border:1.5px solid #D9B45E;box-shadow:0 0 6px rgba(233,196,106,0.55)}
@keyframes gemshine{0%,100%{opacity:0;transform:scale(.4)}50%{opacity:1;transform:scale(1)}}
.gemshine{position:absolute;pointer-events:none;animation:gemshine 1.6s ease-in-out infinite;filter:drop-shadow(0 0 4px #FFFFFF)}
.crystals{inset:0;border-radius:18px;padding:18px;box-sizing:border-box;box-shadow:none;
background:radial-gradient(circle,#FFFFFF 0 .9px,rgba(255,255,255,0) 1.5px) 0 0/7px 9px,radial-gradient(circle,#FFE3EF 0 1.2px,rgba(255,255,255,0) 1.9px) 3px 5px/11px 7px,radial-gradient(circle,#F4A9C8 0 1.5px,rgba(255,255,255,0) 2.2px) 5px 2px/13px 11px,radial-gradient(circle,#DCCBD4 0 1.3px,rgba(255,255,255,0) 2px) 8px 6px/9px 13px,radial-gradient(circle,#B9658D 0 1.4px,rgba(255,255,255,0) 2px) 2px 9px/17px 15px,radial-gradient(circle,#FFFFFF 0 1.8px,rgba(255,255,255,.45) 2.6px,rgba(255,255,255,0) 3.4px) 6px 4px/23px 19px,linear-gradient(135deg,#F2C3D5,#D98CAF 40%,#F6D4E1 60%,#C97A9F);
-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude}
.crystals-twinkle{inset:0;border-radius:18px;padding:18px;box-sizing:border-box;
--hi:radial-gradient(circle,#FFFFFF 0 1.6px,rgba(255,255,255,.8) 2.4px,rgba(255,255,255,0) 4.5px);
background:var(--hi) 0 0/19px 17px,var(--hi) 9px 11px/31px 23px;
-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude;animation:twinkleA 1.1s ease-in-out infinite}
.crystals-twinkle.b{background:var(--hi) 5px 7px/23px 29px,var(--hi) 13px 3px/37px 19px;animation-delay:.55s}
.crystals-line{inset:18px}
@keyframes dia{0%,100%{filter:drop-shadow(0 0 1px #FFFFFF) brightness(1)}50%{filter:drop-shadow(0 0 7px #FFFFFF) brightness(1.45)}}
.dia{position:absolute;width:16px;height:14px;pointer-events:none;animation:dia 1.5s ease-in-out infinite}
.dock-btn:active{transform:scale(.94)}


#drawer{position:absolute;left:24px;top:24px;right:24px;bottom:24px;z-index:50;display:none;flex-direction:column;border-radius:14px;overflow:hidden;
background:radial-gradient(ellipse at 50% 30%,#FFF6F9 0%,#FDE4EE 50%,#F8C9DA 100%);box-shadow:0 0 0 1.5px #D9B45E;font-family:'Quicksand',system-ui,sans-serif;animation:dIn .22s ease-out}
@keyframes dIn{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:scale(1)}}
#drawer header{display:flex;align-items:center;justify-content:space-between;padding:14px 22px 6px}
#drawer h2{margin:0;font-family:'Great Vibes',cursive;font-weight:400;font-size:38px;color:#8A2450}
#drawerClose{height:48px;padding:0 20px;border:none;border-radius:24px;background:#C2477D;color:#fff;font:700 16px 'Quicksand',sans-serif;box-shadow:0 6px 18px rgba(194,71,125,.3)}
#pager{flex:1 1 auto;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
#pager::-webkit-scrollbar{display:none}
.page{flex:0 0 100%;scroll-snap-align:start;box-sizing:border-box;padding:8px 26px 4px;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr));gap:10px 12px}
.app{border:none;background:rgba(255,255,255,.55);border:1px solid rgba(232,170,196,.8);border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:6px;font-family:inherit;box-shadow:0 6px 18px rgba(201,90,138,.10);transition:transform .12s}
.app:active{transform:scale(.93)}
.app img{width:58px;height:58px;object-fit:contain}
.app span{font-size:13px;font-weight:700;color:#5E1636;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#dots{display:flex;justify-content:center;gap:8px;padding:6px 0 12px}
#dots i{width:9px;height:9px;border-radius:50%;background:#F0BCD2;transition:all .2s}
#dots i.on{width:26px;border-radius:5px;background:#C2477D;box-shadow:0 0 6px rgba(255,255,255,.9)}

<div id="drawer" role="dialog" aria-label="Mis aplicaciones">
<header><h2>Mis aplicaciones</h2><button id="drawerClose" onclick="closeDrawer()">Volver</button></header>
<div id="pager"></div>

<script>
function fit(){var s=document.getElementById('stage');s.style.transform='scale('+(window.innerWidth/1024)+','+(window.innerHeight/600)+')';}
window.addEventListener('resize',fit);fit();
var DIAS=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
var MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
function tick(){var d=new Date();var h=d.getHours()%12;if(h===0)h=12;var m=d.getMinutes();
document.getElementById('clock').textContent=(h<10?'0':'')+h+':'+(m<10?'0':'')+m;
document.getElementById('date').textContent=DIAS[d.getDay()]+', '+d.getDate()+' de '+MESES[d.getMonth()];}
tick();setInterval(tick,5000);
function act(fn){try{if(window.Android&&Android[fn])Android[fn]();}catch(e){}}
function media(a){try{if(window.Android)Android.media(a);}catch(e){}}

var appsLoaded=false;
function openDrawer(){var d=document.getElementById('drawer');if(!appsLoaded){buildApps();}d.style.display='flex';document.getElementById('pager').scrollLeft=0;updDots();}
function closeDrawer(){var d=document.getElementById('drawer');if(d.style.display==='flex'){d.style.display='none';return true;}return false;}
function buildApps(){var list=[];try{list=JSON.parse(Android.getApps());}catch(e){list=[];}
var pager=document.getElementById('pager');pager.innerHTML='';var per=18;
for(var i=0;i<list.length;i+=per){var pg=document.createElement('div');pg.className='page';
list.slice(i,i+per).forEach(function(a){var b=document.createElement('button');b.className='app';
b.onclick=function(){try{Android.launch(a.p,a.c);}catch(e){}};
var im=document.createElement('img');im.alt='';if(a.i)im.src='data:image/png;base64,'+a.i;var sp=document.createElement('span');sp.textContent=a.l;
b.appendChild(im);b.appendChild(sp);pg.appendChild(b);});pager.appendChild(pg);}
var dots=document.getElementById('dots');dots.innerHTML='';var n=Math.max(1,Math.ceil(list.length/per));
for(var k=0;k<n;k++){dots.appendChild(document.createElement('i'));}appsLoaded=list.length>0;updDots();}
function updDots(){var pager=document.getElementById('pager');var w=pager.clientWidth||1;var idx=Math.round(pager.scrollLeft/w);
var ds=document.querySelectorAll('#dots i');for(var k=0;k<ds.length;k++){ds[k].className=(k===idx)?'on':'';}}
document.getElementById('pager').addEventListener('scroll',updDots);
function refreshApps(){appsLoaded=false;}
var dTaps=0,dTimer=null;
function tapDiag(){dTaps++;clearTimeout(dTimer);dTimer=setTimeout(function(){dTaps=0;},800);
if(dTaps>=3){dTaps=0;var t='Sin datos';try{t=Android.diag();}catch(e){}var d=document.getElementById('diag');d.textContent=t+'\n\n(Toca aqui para cerrar)';d.style.display='block';}}
function setSpeed(v){document.getElementById('speed').textContent=v;}
</script>
