plugins {
    id 'com.android.application'
}

android {
    namespace 'com.lina.launcher'
    compileSdk 34

    defaultConfig {
        applicationId "com.lina.launcher"
        minSdk 23
        targetSdk 28
        versionCode 4
        versionName "1.3"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
