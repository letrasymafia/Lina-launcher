plugins {
    id 'com.android.application'
}

android {
    namespace 'com.lina.launcher'
    compileSdk 34

    defaultConfig {
        applicationId "com.lina.launcher"
        minSdk 23
        targetSdk 28
        versionCode 9
        versionName "1.8"
    }

    signingConfigs {
        lina {
            storeFile file('lina.keystore')
            storePassword 'linalina'
            keyAlias 'lina'
            keyPassword 'linalina'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.lina
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
